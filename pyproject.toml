[project]
name = "voney"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=4.0.0",
    "alembic>=1.15.1",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.11",
    "jinja2>=3.1.6",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.8.1",
    "pyjwt[crypto]>=2.10.1",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "sqlalchemy>=2.0.39",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "alembic>=1.15.1",
    "black>=25.1.0",
]
test = [
    "greenlet>=3.1.1",
    "pytest>=8.3.5",
    "testcontainers[postgres]>=4.9.2",
]

[tool.pytest.ini_options]
pythonpath = "src"

